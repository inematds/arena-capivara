<svg width="400" height="200" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
  <!-- Fundo -->
  <rect x="0" y="0" width="400" height="200" fill="#87CEEB" rx="10" />
  
  <!-- Capivara -->
  <g id="capivara" transform="translate(150, 100)">
    <!-- Corpo -->
    <ellipse cx="0" cy="0" rx="30" ry="40" fill="#964B00" />
    <!-- Cabeça -->
    <circle cx="-20" cy="-40" r="20" fill="#964B00" />
    <!-- Orelhas -->
    <polygon points="-35,-50 -25,-60 -15,-50" fill="#964B00" />
    <polygon points="-5,-50 5,-60 15,-50" fill="#964B00" />
    <!-- Olhos -->
    <circle cx="-25" cy="-45" r="5" fill="#000" />
    <circle cx="-5" cy="-45" r="5" fill="#000" />
    <!-- Nariz -->
    <circle cx="-15" cy="-35" r="5" fill="#000" />
  </g>
  
  <!-- Bicicleta -->
  <g id="bicicleta" transform="translate(250, 120)">
    <!-- Quadro -->
    <rect x="-50" y="-20" width="100" height="40" fill="#000" rx="10" />
    <!-- Rodas -->
    <circle cx="-40" cy="0" r="20" fill="#000" />
    <circle cx="40" cy="0" r="20" fill="#000" />
    <!-- Guidão -->
    <rect x="-60" y="-40" width="20" height="20" fill="#000" rx="5" />
    <line x1="-60" y1="-40" x2="-60" y2="-20" stroke="#000" stroke-width="5" />
    <!-- Assento -->
    <rect x="-20" y="20" width="40" height="20" fill="#000" rx="5" />
  </g>
  
  <!-- Capivara andando de bicicleta -->
  <use xlink:href="#capivara" transform="translate(250, 100)" />
  <use xlink:href="#bicicleta" transform="translate(250, 120)" />
</svg>