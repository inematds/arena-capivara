<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <!-- Céu e chão -->
  <rect width="400" height="300" fill="#bfe6ff"/>
  <circle cx="340" cy="55" r="28" fill="#ffd94a"/>
  <rect y="245" width="400" height="55" fill="#7cc46a"/>

  <!-- Rodas -->
  <g fill="none" stroke="#333" stroke-width="6">
    <circle cx="110" cy="215" r="45"/>
    <circle cx="290" cy="215" r="45"/>
  </g>
  <g stroke="#888" stroke-width="2">
    <line x1="110" y1="170" x2="110" y2="260"/>
    <line x1="65" y1="215" x2="155" y2="215"/>
    <line x1="78" y1="183" x2="142" y2="247"/>
    <line x1="142" y1="183" x2="78" y2="247"/>
    <line x1="290" y1="170" x2="290" y2="260"/>
    <line x1="245" y1="215" x2="335" y2="215"/>
    <line x1="258" y1="183" x2="322" y2="247"/>
    <line x1="322" y1="183" x2="258" y2="247"/>
  </g>
  <circle cx="110" cy="215" r="5" fill="#333"/>
  <circle cx="290" cy="215" r="5" fill="#333"/>

  <!-- Quadro da bicicleta -->
  <g stroke="#d62828" stroke-width="7" stroke-linecap="round" fill="none">
    <line x1="110" y1="215" x2="190" y2="215"/>
    <line x1="110" y1="215" x2="160" y2="145"/>
    <line x1="160" y1="145" x2="190" y2="215"/>
    <line x1="160" y1="145" x2="265" y2="145"/>
    <line x1="190" y1="215" x2="265" y2="145"/>
    <line x1="265" y1="145" x2="290" y2="215"/>
    <line x1="265" y1="145" x2="258" y2="115"/>
  </g>
  <!-- Guidão -->
  <path d="M245 112 L272 112" stroke="#333" stroke-width="6" stroke-linecap="round"/>
  <!-- Selim -->
  <line x1="160" y1="145" x2="155" y2="130" stroke="#333" stroke-width="5"/>
  <ellipse cx="155" cy="128" rx="20" ry="6" fill="#333"/>
  <!-- Pedivela -->
  <circle cx="190" cy="215" r="10" fill="#555"/>
  <line x1="190" y1="215" x2="205" y2="235" stroke="#333" stroke-width="5"/>
  <rect x="198" y="233" width="18" height="6" rx="2" fill="#222"/>

  <!-- Corpo da capivara -->
  <ellipse cx="180" cy="100" rx="62" ry="42" fill="#a0673a"/>
  <!-- Perna traseira -->
  <path d="M175 125 Q190 180 205 233" stroke="#8a5530" stroke-width="16" stroke-linecap="round" fill="none"/>
  <!-- Braço -->
  <path d="M215 95 Q240 100 255 112" stroke="#8a5530" stroke-width="13" stroke-linecap="round" fill="none"/>
  <circle cx="257" cy="112" r="7" fill="#6b3f22"/>

  <!-- Cabeça -->
  <rect x="215" y="40" width="80" height="55" rx="26" fill="#a0673a"/>
  <!-- Focinho -->
  <rect x="268" y="52" width="38" height="40" rx="16" fill="#8a5530"/>
  <ellipse cx="298" cy="62" rx="3" ry="4" fill="#3a2414"/>
  <!-- Olho -->
  <circle cx="255" cy="58" r="5" fill="#2a1a0e"/>
  <circle cx="257" cy="56" r="1.5" fill="#fff"/>
  <!-- Orelha -->
  <ellipse cx="232" cy="40" rx="8" ry="10" fill="#6b3f22"/>
  <!-- Boca -->
  <path d="M290 80 Q296 84 302 80" stroke="#3a2414" stroke-width="2" fill="none"/>

  <!-- Capacete -->
  <path d="M220 48 Q245 10 285 40 Z" fill="#2a9d8f"/>
  <line x1="222" y1="48" x2="236" y2="72" stroke="#2a9d8f" stroke-width="2"/>

  <!-- Linhas de movimento -->
  <g stroke="#ffffff" stroke-width="3" stroke-linecap="round">
    <line x1="20" y1="120" x2="55" y2="120"/>
    <line x1="10" y1="150" x2="50" y2="150"/>
    <line x1="25" y1="180" x2="55" y2="180"/>
  </g>
</svg>