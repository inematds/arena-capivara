<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8fd3f4"/>
      <stop offset="1" stop-color="#e0f7fa"/>
    </linearGradient>
    <g id="wheel">
      <circle r="90" fill="none" stroke="#2b2b2b" stroke-width="12"/>
      <circle r="81" fill="none" stroke="#bdbdbd" stroke-width="3"/>
      <g stroke="#9e9e9e" stroke-width="2">
        <line x1="-80" y1="0" x2="80" y2="0"/>
        <line x1="0" y1="-80" x2="0" y2="80"/>
        <line x1="-57" y1="-57" x2="57" y2="57"/>
        <line x1="-57" y1="57" x2="57" y2="-57"/>
        <line x1="-74" y1="-31" x2="74" y2="31"/>
        <line x1="-74" y1="31" x2="74" y2="-31"/>
        <line x1="-31" y1="-74" x2="31" y2="74"/>
        <line x1="-31" y1="74" x2="31" y2="-74"/>
      </g>
      <circle r="9" fill="#555"/>
    </g>
  </defs>

  <!-- Céu -->
  <rect width="800" height="600" fill="url(#sky)"/>

  <!-- Sol -->
  <circle cx="680" cy="100" r="50" fill="#ffd54f"/>
  <circle cx="680" cy="100" r="65" fill="#ffd54f" opacity="0.3"/>

  <!-- Nuvens -->
  <g fill="#ffffff" opacity="0.9">
    <ellipse cx="150" cy="100" rx="60" ry="25"/>
    <ellipse cx="190" cy="85" rx="45" ry="25"/>
    <ellipse cx="110" cy="90" rx="35" ry="20"/>
    <ellipse cx="480" cy="70" rx="50" ry="20"/>
    <ellipse cx="515" cy="58" rx="35" ry="18"/>
  </g>

  <!-- Chão -->
  <rect x="0" y="540" width="800" height="60" fill="#7cb342"/>
  <rect x="0" y="540" width="800" height="8" fill="#689f38"/>
  <g stroke="#558b2f" stroke-width="3" stroke-linecap="round">
    <path d="M60 540 l-5 -14 M66 540 l3 -16 M72 540 l8 -12"/>
    <path d="M690 540 l-5 -14 M696 540 l3 -16 M702 540 l8 -12"/>
    <path d="M400 540 l-4 -10 M406 540 l3 -12"/>
  </g>

  <!-- Linhas de velocidade -->
  <g stroke="#ffffff" stroke-width="5" stroke-linecap="round" opacity="0.8">
    <line x1="40" y1="280" x2="140" y2="280"/>
    <line x1="20" y1="330" x2="110" y2="330"/>
    <line x1="50" y1="390" x2="130" y2="390"/>
  </g>

  <!-- Sombra -->
  <ellipse cx="400" cy="545" rx="260" ry="12" fill="#33691e" opacity="0.35"/>

  <!-- Rodas -->
  <use href="#wheel" x="250" y="450"/>
  <use href="#wheel" x="550" y="450"/>

  <!-- Perna traseira (lado oposto) -->
  <g stroke="#6b4423" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M350 300 L395 365 L372 425" stroke-width="30"/>
  </g>
  <ellipse cx="378" cy="430" rx="20" ry="9" fill="#4e3118"/>

  <!-- Pedivela oposta -->
  <line x1="390" y1="450" x2="374" y2="432" stroke="#444" stroke-width="6" stroke-linecap="round"/>

  <!-- Quadro da bicicleta -->
  <g stroke="#e53935" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <line x1="250" y1="450" x2="390" y2="450"/>
    <line x1="250" y1="450" x2="355" y2="340"/>
    <line x1="390" y1="450" x2="352" y2="328"/>
    <line x1="355" y1="340" x2="508" y2="318"/>
    <line x1="390" y1="450" x2="513" y2="338"/>
  </g>
  <!-- Garfo e guidão -->
  <g stroke="#424242" stroke-width="8" stroke-linecap="round" fill="none">
    <path d="M500 285 L515 340 L550 450"/>
    <path d="M500 285 L530 275"/>
  </g>
  <circle cx="532" cy="274" r="7" fill="#212121"/>

  <!-- Selim -->
  <path d="M320 322 Q350 312 385 322 Q370 332 345 330 Q328 330 320 322 Z" fill="#212121"/>

  <!-- Coroa e corrente -->
  <circle cx="390" cy="450" r="20" fill="#757575" stroke="#424242" stroke-width="4"/>
  <circle cx="390" cy="450" r="6" fill="#212121"/>

  <!-- Corpo da capivara -->
  <ellipse cx="385" cy="250" rx="118" ry="75" fill="#a0703c" transform="rotate(-12 385 250)"/>
  <ellipse cx="395" cy="275" rx="85" ry="42" fill="#b88a55" opacity="0.6" transform="rotate(-12 395 275)"/>

  <!-- Pelos do corpo -->
  <g stroke="#7a5230" stroke-width="3" stroke-linecap="round" opacity="0.7">
    <path d="M300 235 l-10 6 M320 215 l-10 6 M345 240 l-10 6 M370 210 l-10 5 M400 230 l-10 5 M330 265 l-10 6"/>
  </g>

  <!-- Perna traseira (lado de cá) -->
  <ellipse cx="345" cy="295" rx="48" ry="40" fill="#946635"/>
  <g stroke="#946635" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M350 305 L425 385 L405 462" stroke-width="32"/>
  </g>
  <ellipse cx="412" cy="470" rx="24" ry="10" fill="#5d3a1a"/>

  <!-- Pedivela e pedal -->
  <line x1="390" y1="450" x2="408" y2="476" stroke="#444" stroke-width="6" stroke-linecap="round"/>
  <rect x="392" y="478" width="38" height="8" rx="3" fill="#212121"/>

  <!-- Cabeça -->
  <g transform="rotate(-6 510 180)">
    <!-- Orelhas -->
    <ellipse cx="462" cy="132" rx="14" ry="17" fill="#7a5230"/>
    <ellipse cx="462" cy="134" rx="7" ry="9" fill="#c9968a"/>
    <!-- Cabeça quadradona -->
    <path d="M440 165 Q440 135 475 132 L545 135 Q585 138 588 170 L588 205 Q586 232 555 232 L475 232 Q440 230 440 200 Z" fill="#a0703c"/>
    <!-- Focinho -->
    <path d="M545 136 Q585 138 588 170 L588 205 Q586 232 555 232 L540 232 Q550 185 545 136 Z" fill="#8b5e34"/>
    <!-- Narina -->
    <ellipse cx="578" cy="165" rx="5" ry="8" fill="#3e2613"/>
    <!-- Boca -->
    <path d="M588 205 Q565 212 548 204" stroke="#3e2613" stroke-width="3" fill="none" stroke-linecap="round"/>
    <!-- Olho -->
    <circle cx="505" cy="160" r="9" fill="#1b1b1b"/>
    <circle cx="508" cy="157" r="3" fill="#ffffff"/>
    <!-- Sobrancelha tranquila -->
    <path d="M492 146 Q505 140 518 146" stroke="#5d3a1a" stroke-width="3" fill="none" stroke-linecap="round"/>
    <!-- Bochecha -->
    <ellipse cx="520" cy="198" rx="12" ry="7" fill="#d98a6a" opacity="0.5"/>
  </g>

  <!-- Braço -->
  <g stroke="#946635" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M455 245 L500 268 L524 276" stroke-width="26"/>
  </g>
  <ellipse cx="528" cy="276" rx="13" ry="11" fill="#5d3a1a"/>
</svg>