<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200">
  <g transform="scale(2)">
    <!-- Corpo da capivara -->
    <ellipse cx="100" cy="80" rx="50" ry="60" fill="#964B00" />
    
    <!-- Cabeça da capivara -->
    <circle cx="105" cy="55" r="20" fill="#964B00" />
    
    <!-- Pernas da capivara -->
    <line x1="50" y1="100" x2="150" y2="100" stroke="#964B00" stroke-width="5" />
    <line x1="100" y1="100" x2="100" y2="150" stroke="#964B00" stroke-width="5" />
    <line x1="50" y1="100" x2="50" y2="150" stroke="#964B00" stroke-width="5" />
    
    <!-- Bicicleta -->
    <rect x="50" y="40" width="80" height="20" fill="#964B00" rx="10" />
    <rect x="70" y="40" width="20" height="40" fill="#964B00" rx="10" />
    <rect x="30" y="50" width="40" height="20" fill="#964B00" rx="10" />
    <rect x="60" y="50" width="20" height="40" fill="#964B00" rx="10" />
  </g>
  
  <!-- Rodas da bicicleta -->
  <circle cx="55" cy="35" r="10" fill="#964B00" />
  <circle cx="115" cy="35" r="10" fill="#964B00" />
  <circle cx="30" cy="55" r="10" fill="#964B00" />
  <circle cx="60" cy="55" r="10" fill="#964B00" />
</svg>